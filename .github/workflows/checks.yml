name: Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned instruction decoder
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          decoder = next(line for line in Path("requirements.txt").read_text().splitlines()
                         if line.startswith("rabbitizer=="))
          subprocess.run([sys.executable, "-m", "pip", "install", decoder], check=True)
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Catalogues and sources
        run: python tests/check_repository.py
      - name: Return types agree across files
        # clang ships with the ubuntu-latest runner image; its MIPS front end parses the sources
        run: |
          clang --version | head -1
          python tests/check_return_types.py --jobs 4
      - name: Compile tools
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          files = sorted({*Path("tools").glob("*.py"), *Path("tools/compiler").rglob("*.py")})
          for f in files:
              py_compile.compile(str(f), doraise=True)
          print(f"compiled {len(files)} files")
          PY
